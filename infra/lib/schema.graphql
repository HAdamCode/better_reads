type User {
  userId: ID!
  email: String!
  handle: String!
  displayName: String!
  avatarUrl: String
  bio: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Book {
  isbn: String!
  title: String!
  authors: [String!]!
  coverUrl: String
  description: String
  pageCount: Int
  publishedDate: String
  subjects: [String]
  averageRating: Float
  ratingsCount: Int
}

enum Shelf {
  WANT_TO_READ
  CURRENTLY_READING
  READ
}

type UserBook {
  userId: ID!
  bookId: String!
  shelf: Shelf!
  customShelfIds: [String!]
  rating: Int
  notes: String
  totalPages: Int
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  pagesRead: Int
  addedAt: AWSDateTime
  updatedAt: AWSDateTime!
}

type ReadingSession {
  userId: ID!
  bookId: String!
  sessionId: ID!
  startedAt: AWSDateTime!
  finishedAt: AWSDateTime
  createdAt: AWSDateTime!
}

type CustomShelf {
  userId: ID!
  shelfId: ID!
  name: String!
  description: String
  bookRatings: AWSJSON
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type BookLoan {
  userId: ID!
  loanId: ID!
  bookId: String!
  borrowerName: String!
  lentAt: AWSDateTime!
  returnedAt: AWSDateTime
}

type Review {
  bookId: String!
  reviewId: ID!
  userId: ID!
  rating: Int!
  content: String
  createdAt: AWSDateTime!
}

enum FriendStatus {
  PENDING
  ACCEPTED
  BLOCKED
}

type Friend {
  userId: ID!
  friendId: ID!
  status: FriendStatus!
  createdAt: AWSDateTime!
}

enum ActivityType {
  ADDED_BOOK
  STARTED_READING
  FINISHED_BOOK
  RATED_BOOK
  REVIEWED_BOOK
  ADDED_FRIEND
}

type Activity {
  userId: ID!
  timestamp: AWSDateTime!
  type: ActivityType!
  bookId: String
  friendId: ID
  rating: Int
  message: String
}

type ReadingStats {
  userId: ID!
  period: String!
  booksRead: Int!
  pagesRead: Int!
  averageRating: Float
  favoriteGenre: String
}

type ReadingGoal {
  userId: ID!
  year: Int!
  bookGoal: Int
  pageGoal: Int
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# Input types
input CreateUserInput {
  email: String!
  handle: String!
  displayName: String!
  bio: String
  avatarUrl: String
}

input UpdateUserInput {
  handle: String
  displayName: String
  bio: String
  avatarUrl: String
}

input AddBookToShelfInput {
  bookId: String!
  shelf: Shelf!
  customShelfIds: [String!]
  rating: Int
  notes: String
  totalPages: Int
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  pagesRead: Int
}

input UpdateBookShelfInput {
  bookId: String!
  shelf: Shelf!
  customShelfIds: [String!]
  rating: Int
  notes: String
  totalPages: Int
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
  pagesRead: Int
}

input CreateReviewInput {
  bookId: String!
  rating: Int!
  content: String
}

input CreateCustomShelfInput {
  name: String!
  description: String
}

input UpdateCustomShelfInput {
  shelfId: ID!
  name: String
  description: String
}

input LendBookInput {
  bookId: String!
  borrowerName: String!
}

input CreateReadingSessionInput {
  bookId: String!
  startedAt: AWSDateTime!
}

input UpdateReadingSessionInput {
  sessionId: ID!
  bookId: String!
  startedAt: AWSDateTime
  finishedAt: AWSDateTime
}

input UpdateLoanInput {
  loanId: ID!
  borrowerName: String
}

input SetReadingGoalInput {
  year: Int!
  bookGoal: Int
  pageGoal: Int
}

# Queries
type Query {
  # User queries
  me: User
  getUser(userId: ID!): User
  getUserByHandle(handle: String!): User
  isHandleAvailable(handle: String!): Boolean!
  searchUsers(query: String!, limit: Int): [User]

  # Book queries
  myBooks: [UserBook]
  getUserBooks(userId: ID!): [UserBook]
  getBookReviews(bookId: String!, limit: Int): [Review]

  # Reading session queries
  getReadingSessions(bookId: String!): [ReadingSession]
  getAllReadingSessions: [ReadingSession]

  # Custom shelf queries
  myCustomShelves: [CustomShelf]

  # Lending queries
  myLoans: [BookLoan]
  activeLoans: [BookLoan]

  # Social queries
  getFriends: [Friend]
  getFriendRequests: [Friend]
  getActivityFeed(limit: Int): [Activity]

  # Stats queries
  getReadingStats: [ReadingStats]

  # Reading goals queries
  getReadingGoals: [ReadingGoal]
  getReadingGoal(year: Int!): ReadingGoal
}

# Mutations
type Mutation {
  # User mutations
  createUser(input: CreateUserInput!): User
  updateUser(input: UpdateUserInput!): User

  # Book mutations
  addBookToShelf(input: AddBookToShelfInput!): UserBook
  updateBookShelf(input: UpdateBookShelfInput!): UserBook
  removeBookFromShelf(bookId: String!): UserBook

  # Custom shelf mutations
  createCustomShelf(input: CreateCustomShelfInput!): CustomShelf
  updateCustomShelf(input: UpdateCustomShelfInput!): CustomShelf
  deleteCustomShelf(shelfId: ID!): CustomShelf
  updateShelfBookRating(shelfId: ID!, bookId: String!, rating: Int): CustomShelf

  # Lending mutations
  lendBook(input: LendBookInput!): BookLoan
  returnBook(loanId: ID!): BookLoan
  updateLoan(input: UpdateLoanInput!): BookLoan
  deleteLoan(loanId: ID!): BookLoan

  # Review mutations
  createReview(input: CreateReviewInput!): Review
  deleteReview(bookId: String!, reviewId: ID!): Review

  # Reading session mutations
  createReadingSession(input: CreateReadingSessionInput!): ReadingSession
  updateReadingSession(input: UpdateReadingSessionInput!): ReadingSession
  deleteReadingSession(sessionId: ID!, bookId: String!): ReadingSession

  # Social mutations
  addFriend(friendId: ID!): Friend
  acceptFriend(friendId: ID!): Friend
  removeFriend(friendId: ID!): Friend

  # Reading goal mutations
  setReadingGoal(input: SetReadingGoalInput!): ReadingGoal
}

# Subscriptions for real-time updates
type Subscription {
  onBookAdded(userId: ID!): UserBook
    @aws_subscribe(mutations: ["addBookToShelf"])
  onReviewCreated(bookId: String!): Review
    @aws_subscribe(mutations: ["createReview"])
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
